<style>
  :root { --text: #1d1d1f; --muted: #5f6368; --rule: #d9d9de; --code-bg: #f4f4f6; --link: #1f5fbf; }
  body { max-width: 50em; margin: 0 auto; padding: 2em 16px; color: var(--text); background: #fff;
         font: 16px/1.6 "Noto Serif", Georgia, serif; hyphens: auto; }
  h1, h2, h3, h4, nav, figcaption, table { font-family: "Noto Sans", "Helvetica Neue", Arial, sans-serif; }
  h1 { margin-top: 2.5em; border-bottom: 2px solid var(--rule); padding-bottom: .2em; }
  h1.teil, h1.anhang { text-align: center; border: 0; margin: 3em 0 1em; font-size: 2.2em; }
  .nummer { color: var(--muted); }
  a { color: var(--link); }
  code { font-size: .9em; background: var(--code-bg); padding: .1em .25em; border-radius: 3px; }
  pre { background: var(--code-bg); padding: .8em 1em; overflow-x: auto; border-radius: 4px; line-height: 1.4; }
  pre code { background: none; padding: 0; }
  pre.mermaid { background: none; text-align: center; }
  table { border-collapse: collapse; margin: 1em 0; font-size: .9em; display: block; overflow-x: auto; }
  th, td { border: 1px solid var(--rule); padding: .3em .6em; vertical-align: top; }
  figure { margin: 1.5em 0; text-align: center; }
  figure img { max-width: 100%; }
  figcaption { font-size: .9em; color: var(--muted); margin-top: .4em; }
  nav#TOC ul { list-style: none; padding-left: 1.2em; }
  nav#TOC > ul { padding-left: 0; }
  nav#TOC a { text-decoration: none; }
  header#title-block-header { text-align: center; margin: 4em 0 3em; }
  @media print {
    body { max-width: none; padding: 0; font-size: 11pt; }
    h1 { break-before: page; }
    h2, h3 { break-after: avoid; }
    pre, figure, tr { break-inside: avoid; }
    nav#TOC { break-before: page; }
    table { display: table; }
  }
  @page { size: A4; margin: 2cm 2cm 2.2cm; }
</style>
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  mermaid.initialize({
    startOnLoad: true,
    theme: "base",
    flowchart: { nodeSpacing: 30, rankSpacing: 38, curve: "basis" },
    themeVariables: {
      fontFamily: '"Noto Sans", "Helvetica Neue", Arial, sans-serif',
      fontSize: "14px",
      primaryColor: "#eef3fa",        /* Kastenfüllung: sehr helles Blau */
      primaryBorderColor: "#a9bcd6",  /* Kastenrand: zartes Graublau */
      primaryTextColor: "#2f3b4c",
      lineColor: "#5b6b80",           /* Pfeile: gut sichtbar, nicht schwarz */
      edgeLabelBackground: "#ffffff",
      tertiaryColor: "#f6f8fb",
    },
    themeCSS: `
      .flowchart-link { stroke-width: 1.8px; }
      marker path { fill: #5b6b80; stroke: #5b6b80; }
      .node rect, .node polygon { rx: 4px; ry: 4px; stroke-width: 1px; }
      .edgeLabel { color: #5f6b7a; font-size: 13px; }
    `,
  });
</script>
